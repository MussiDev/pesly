name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://argent:argent@localhost:5432/argent
  TEST_DATABASE_URL: postgres://argent:argent@localhost:5432/argent_test
  E2E_DATABASE_URL: postgres://argent:argent@localhost:5432/argent_e2e
  JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-bytes-long
  WEB_ORIGIN: http://localhost:3000
  API_ORIGIN: http://localhost:4000
  WEB_BASE_URL: http://localhost:3000
  EMAIL_PROVIDER: console
  BREACH_CHECKER: fake
  TRUST_PROXY: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argent
          POSTGRES_PASSWORD: argent
          POSTGRES_DB: argent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argent -d argent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Durability is irrelevant for a throwaway test database; these settings reload without a restart.
      - name: Relax Postgres durability for the test database
        run: >-
          psql postgres://argent:argent@localhost:5432/argent_test
          -c "alter system set fsync = off"
          -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off"
          -c "select pg_reload_conf()"
      - name: Unit and integration tests with coverage floor
        run: pnpm test:coverage

  perf:
    # Latency budgets (NFR-06) depend on the runner, so they are reported apart from `test`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argent
          POSTGRES_PASSWORD: argent
          POSTGRES_DB: argent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argent -d argent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Latency benchmarks
        run: pnpm test:perf

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argent
          POSTGRES_PASSWORD: argent
          POSTGRES_DB: argent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argent -d argent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
